server:
  # Behind Traefik: Tomcat reads X-Forwarded-Proto and X-Forwarded-Host from the proxy, so the request is https on the
  # public host (ADR 0010).
  forward-headers-strategy: native

spring:
  application:
    name: semaphore
  autoconfigure:
    # The only login is the guest's session and, later, GitHub and Google: no user store, so no generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    # Nobody listens to ServletRequestHandledEvent, and publishing it reads the session once more: with Valkey out of
    # reach that read would turn a clean 503 into a 500 (ADR 0010).
    publish-request-handled-events: false
  task:
    scheduling:
      pool:
        # The sweeps and the check of versions wait on Redis: one slow one must not hold up the rest.
        size: 3
  datasource:
    hikari:
      # Two replicas share one Postgres, and a game only writes once, when it ends.
      maximum-pool-size: 4
      # The pool is idle most of the time: it grows under load and shrinks back to one connection.
      minimum-idle: 1
      # A database that does not answer must not hold a request for the 30 seconds of the default.
      connection-timeout: 2000
      data-source-properties:
        # A connection that went half dead must free its thread (seconds, for any read on the
        # socket: a migration with a statement longer than this must raise it).
        socketTimeout: 10

management:
  health:
    db:
      # The database is not the game: if it is down both replicas must stay in the load balancer (ADR 0008).
      enabled: false
  endpoints:
    web:
      exposure:
        # Health only: the probes and the container health check need nothing else.
        include: health

semaphore:
  # A team needs a Signaleur and at least one lookout.
  min-team-size: 2
  bots:
    # What a bot waits before a signal and before each card, so that a table sees it play (ADR 0016).
    think: 3s
    pause: 2s
  # Browsers send the page's origin on a WebSocket handshake, and the server refuses the others.
  allowed-origins: https://play.didelo.fr
  session:
    # A guest who does not come back for this long is forgotten: the session leaves Valkey. Each use renews it (ADR 0010).
    idle-timeout: 7d
    # The cookie is written once, with the session, and never renewed: whatever happens the browser drops it after this
    # long (ADR 0010). A session that signed in to an account stops counting as one after the same time, whatever the
    # cookie it is sent with (ADR 0011).
    cookie-max-age: 30d
  # Sign in with GitHub or Google (ADR 0011). A provider is on when both of its values are set and not blank, and there is a
  # database; with none, the game plays for guests only. In production they are files read by configtree
  # (semaphore.auth.github.client-id, semaphore.auth.github.client-secret, and the same for google); an empty file is blank.
  #   semaphore.auth.<github|google>.client-id / client-secret
  # The addresses of the provider are fixed; these replace them (tests, GitHub Enterprise):
  #   authorization-uri, token-uri, user-info-uri, jwk-set-uri, issuer-uri
