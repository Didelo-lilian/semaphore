spring:
  application:
    name: semaphore
  task:
    scheduling:
      pool:
        # The sweeps and the check of versions wait on Redis: one slow one must not hold up the rest.
        size: 3
  datasource:
    hikari:
      # Two replicas share one Postgres, and a game only writes once, when it ends.
      maximum-pool-size: 4
      # A database that does not answer must not hold a request for the 30 seconds of the default.
      connection-timeout: 2000

management:
  health:
    db:
      # The database is not the game: if it is down both replicas must stay in the load balancer (ADR 0008).
      enabled: false
  endpoints:
    web:
      exposure:
        # Health only: the probes and the container health check need nothing else.
        include: health

semaphore:
  # A team needs a Signaleur and at least one lookout.
  min-team-size: 2
  # Browsers send the page's origin on a WebSocket handshake, and the server refuses the others.
  allowed-origins: https://play.didelo.fr
