server {
  listen 8080;
  root /usr/share/nginx/html;

  # Vite names these files after their content: they never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Any other path is a screen of the app (/salon/ABCDE): the router takes it from index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
