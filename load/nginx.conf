# Round robin over the replicas of the backend: Docker's DNS answers `backend` with one address per replica, and nginx
# reads them all when it starts. Nothing is sticky: with the rooms in memory a room lives in one replica, so a table of
# five connections spread over two of them gets "no such room". The rooms have to be shared first (the redis profile).
worker_processes auto;

events {
  # A proxied WebSocket takes two connections, one on each side: the default 1024 stops the test at about 100 rooms.
  worker_connections 16384;
}

http {
  access_log off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream backend {
    server backend:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # A game lasts minutes and a WebSocket says nothing while players think.
      proxy_read_timeout 1h;
    }
  }
}
