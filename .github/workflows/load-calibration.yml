name: Load calibration

# Temporary: measures candidate profiles on the runner, to be deleted before the merge.
on:
  pull_request:
    paths: [".github/workflows/load-calibration.yml"]

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: short-a, rooms: 50, duration: 30s }
          - { name: short-b, rooms: 50, duration: 30s }
          - { name: short-c, rooms: 50, duration: 30s }
          - { name: s100, rooms: 100, duration: 30s }
          - { name: long100, rooms: 100, duration: 5m }
          - { name: long150, rooms: 150, duration: 5m }
          - { name: long200, rooms: 200, duration: 5m }
    env:
      ROOMS: ${{ matrix.rooms }}
      DURATION: ${{ matrix.duration }}
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f load/compose.yaml up --build --abort-on-container-exit --exit-code-from k6
      - if: ${{ !cancelled() && hashFiles('load/results/summary.md') != '' }}
        run: cat load/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: calibration-${{ matrix.name }}
          path: load/results
          if-no-files-found: ignore
