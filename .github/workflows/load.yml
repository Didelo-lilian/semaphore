name: Load

# Not a required check: it measures a shared runner, and a slow one is a reason to look, not to block a merge.
on:
  pull_request:
    paths: ["backend/**", "load/**", ".github/workflows/load.yml"]
  workflow_dispatch:
    inputs:
      profile:
        description: How many rooms play, and for how long
        type: choice
        options: [long, short]
        default: long

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE: ${{ inputs.profile || 'short' }}
    steps:
      - uses: actions/checkout@v7
      # The backend is built from backend/ with the production Dockerfile and k6 plays whole games against it through
      # nginx, on this runner: it never goes near play.didelo.fr. A threshold that fails fails the step, and the logs
      # of the backend and nginx are in it.
      - run: docker compose -f load/compose.yaml up --build --exit-code-from k6
      - if: ${{ !cancelled() && hashFiles('load/results/summary.md') != '' }}
        run: cat load/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-results
          path: load/results
          if-no-files-found: ignore
