version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # The runtime stays on the JDK LTS (25), not on the latest non-LTS release.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker-compose
    directory: /load
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      spring:
        patterns: ["org.springframework.boot", "org.springframework.boot:*", "io.spring.dependency-management"]
      dev-tools:
        patterns: ["*"]
        exclude-patterns: ["org.springframework.boot", "org.springframework.boot:*", "io.spring.dependency-management"]
