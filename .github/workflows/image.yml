name: Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Never cancel: a half-pushed image is worse than waiting.
concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/didelo-lilian/semaphore

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "$IMAGE:main" -t "$IMAGE:sha-${GITHUB_SHA::7}" backend
          docker push --all-tags "$IMAGE"
