# Round robin over the replicas of the backend: Docker's DNS answers `backend` with one address per replica, and nginx
# reads them all when it starts. Nothing is sticky, as in production: the connections of a table spread over the
# replicas (the round robin runs in each worker of nginx) and find their room because the replicas share the rooms in
# Redis (ADR 0008). Without Redis, a room lives in one replica and the others answer "no such room".
worker_processes auto;

# A proxied WebSocket takes two connections, one on each side: the defaults stop the test at about 100 rooms.
worker_rlimit_nofile 32768;

events {
  worker_connections 16384;
}

http {
  access_log off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream backend {
    server backend:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
